<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="cobaltBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E3FDE" />
      <stop offset="55%" stop-color="#0D229E" />
      <stop offset="100%" stop-color="#07135C" />
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Full-bleed rounded badge background -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#cobaltBg)" />

  <!-- Subtle outer calendar bezel ring -->
  <circle cx="256" cy="256" r="204" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" />

  <!-- 7 weekday sector radial dividers (outer ring ticks) -->
  <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
    <line x1="256" y1="54" x2="256" y2="82" />
    <line x1="414" y1="130" x2="392" y2="148" />
    <line x1="453" y1="301" x2="426" y2="295" />
    <line x1="344" y1="438" x2="332" y2="413" />
    <line x1="168" y1="438" x2="180" y2="413" />
    <line x1="59" y1="301" x2="86" y2="295" />
    <line x1="98" y1="130" x2="120" y2="148" />
  </g>

  <!-- Concentric orbital calendar tracks -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="5" />
  <circle cx="256" cy="256" r="134" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="5" />
  <circle cx="256" cy="256" r="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.46" stroke-width="5" />

  <!-- Continuous Archimedean-style spiral path winding inward -->
  <path
    d="M 256 78
       A 178 178 0 1 1 82 232
       A 158 158 0 0 1 256 120
       A 136 136 0 1 1 128 286
       A 114 114 0 0 1 256 164
       A 92 92 0 1 1 174 268
       A 70 70 0 0 1 256 206"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="14"
    stroke-linecap="round"
  />

  <!-- Active date highlight marker on upper-right spiral track -->
  <circle cx="381" cy="131" r="20" fill="url(#goldAccent)" stroke="#07135C" stroke-width="5" />

  <!-- Secondary milestone marker on inner-left spiral ring -->
  <circle cx="144" cy="322" r="13" fill="#FFFFFF" />
  <circle cx="144" cy="322" r="6" fill="#0D229E" />

  <!-- Central double-ring horological bullseye hub -->
  <circle cx="256" cy="256" r="46" fill="#07135C" stroke="#FFFFFF" stroke-width="7" />
  <circle cx="256" cy="256" r="24" fill="url(#goldAccent)" />
  <circle cx="256" cy="256" r="8" fill="#07135C" />
</svg>
